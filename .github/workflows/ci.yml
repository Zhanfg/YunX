name: Android CI

on:
  push:
    branches:
      - "master"
      - "feat/**"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # CI访问阿里云镜像会 502：跳过国内镜像，直接走 Google/Maven Central 官方源
    env:
      YUNX_USE_MIRROR: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 显式安装 Android SDK（compileSdk=36 / build-tools），避免依赖 runner 预装版本或 AGP 现场下载
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 同时验证 debug / release 编译链路；release 未配置生产签名时产出 unsigned APK 也可用于静态构建验证
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      # 上传 debug APK 产物（PR 评论 / Actions 页面可下载）
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
